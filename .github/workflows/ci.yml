name: AgentFuzz CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Unit Tests (no server, no API key required) ────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/test_agentfuzz.py -k "not e2e and not End" -v --tb=short

  # ── Integration Tests (spins up mock target) ───────────────────────────────
  integration-tests:
    name: Integration Tests (mock target)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Start mock target (port 8001)
        run: |
          uvicorn tests.target_mock:app --host 0.0.0.0 --port 8001 --log-level error &
          sleep 3

      - name: Run integration tests
        run: |
          pytest tests/test_agentfuzz.py -k "e2e or End" -v --tb=short

  # ── Security Fuzz Run (against mock target, fails on vuln found) ───────────
  security-fuzz:
    name: Security Fuzz Run
    runs-on: ubuntu-latest
    needs: unit-tests
    # This job is expected to exit 2 (vulnerabilities found in the mock target)
    # In a real project, point this at your actual staging agent and assert exit 0.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Start mock target
        run: |
          uvicorn tests.target_mock:app --host 0.0.0.0 --port 8000 --log-level error &
          sleep 3

      - name: Run fuzzer and save report
        run: |
          python -m agentfuzz fuzz \
            --target http://localhost:8000/chat \
            --concurrency 10 \
            --output reports/ci_report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentfuzz-security-report
          path: reports/ci_report.json
          retention-days: 30
