[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundsec"
version = "0.2.0"
description = "Coverage-guided security fuzzing for LLM agents, with a reproducible ground-truth benchmark"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Mohamed Seddik Ben Bait"}]
keywords = ["security", "fuzzing", "llm", "ai-agents", "red-team",
            "prompt-injection", "coverage-guided", "ai-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "aiohttp>=3.9.5",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
live = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.1", "httpx>=0.27.0"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7", "ruff>=0.5.0"]

[project.urls]
Repository = "https://github.com/MouhBbt/BoundSec"
Issues = "https://github.com/MouhBbt/BoundSec/issues"

[project.scripts]
boundsec = "boundsec.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["boundsec*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501 line length (handled by formatter intent); B008/B006 (typer/pydantic idioms);
# E702 semicolons (deliberate in a few compact spots); UP042 (str+Enum is the pydantic
# idiom and intentional); B027 (SearchStrategy.observe is an intentional no-op hook).
ignore = ["E501", "B008", "B006", "E702", "UP042", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Dense visualization code: semicolon-joined plotting statements and throwaway
# layout assignments are a deliberate, readable style in these two modules.
"boundsec/analysis/figures.py" = ["E702", "B905", "B007", "C416"]
"boundsec/analysis/diagrams.py" = ["E702", "F841"]
