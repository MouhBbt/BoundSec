[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfuzz"
version = "0.1.0"
description = "Boundary-aware security fuzzing framework for autonomous AI agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = ["security", "fuzzing", "llm", "ai", "red-team", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7.0",
    "aiohttp>=3.9.5",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/your-org/agentfuzz"
Repository = "https://github.com/your-org/agentfuzz"
Issues = "https://github.com/your-org/agentfuzz/issues"
Changelog = "https://github.com/your-org/agentfuzz/blob/main/CHANGELOG.md"

[project.scripts]
agentfuzz = "agentfuzz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfuzz*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B006"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
"tests/target_mock.py" = ["S602", "S603", "S607", "S104", "S108"]
