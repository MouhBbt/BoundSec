# BoundSec — run the full offline evaluation in a container and persist results.
#   docker compose run --rm evaluate
services:
  evaluate:
    build: .
    entrypoint: ["python", "experiments/run_full_suite.py"]
    command: ["--budget", "600", "--seeds", "15"]
    volumes:
      - ./results:/app/results
      - ./figures:/app/figures

  # Fuzz a live model (needs an API key in the environment or .env)
  fuzz-live:
    build: .
    entrypoint: ["python", "-m", "boundsec.cli", "fuzz"]
    command: ["--target", "live:gpt-4o-mini", "--budget", "60"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AGENTFUZZ_LLM_MODEL=${AGENTFUZZ_LLM_MODEL:-gpt-4o-mini}
