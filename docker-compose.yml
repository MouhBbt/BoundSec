services:
  # ── Intentionally vulnerable mock target agent ─────────────────────────────
  mock-target:
    build: .
    entrypoint: ["python", "tests/target_mock.py"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Fuzzer – runs against the mock target ─────────────────────────────────
  fuzzer:
    build: .
    depends_on:
      mock-target:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./reports:/app/reports   # persist JSON reports to host
    command:
      - fuzz
      - --target
      - http://mock-target:8000/chat
      - --concurrency
      - "10"
      - --verbose
      - --output
      - /app/reports/docker_run.json
